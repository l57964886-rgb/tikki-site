<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Рассылка — Тикки Бот</title>
<style>
:root{--bg:#12060f;--card:#1e0c19;--line:#3a1a30;--text:#f7ecf3;--dim:#a98b9e;--red:#ff2e63;--cyan:#3fd0e0}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(900px 500px at 20% -10%,#3a0b22,transparent),var(--bg);color:var(--text);font:16px/1.5 Nunito,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:28px 16px}
.wrap{width:100%;max-width:640px}
h1{font-size:1.5rem;margin:0 0 4px;display:flex;align-items:center;gap:10px}
h1 img{width:40px;height:40px;border-radius:50%;box-shadow:0 0 18px rgba(255,46,99,.6)}
.sub{color:var(--dim);margin:0 0 20px;font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
label{display:block;font-size:.8rem;color:var(--dim);margin:14px 0 6px}
label:first-child{margin-top:0}
input,textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#150910;color:var(--text);font:inherit;resize:vertical}
textarea{min-height:150px;line-height:1.45}
input:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px rgba(255,46,99,.18)}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
button{flex:1;min-width:150px;padding:13px 18px;border-radius:12px;border:0;background:var(--red);color:#fff;font:800 1rem Nunito,system-ui,sans-serif;cursor:pointer;transition:.2s}
button:hover{filter:brightness(1.1)}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);font-weight:700}
button:disabled{opacity:.6;cursor:default}
.msg{margin-top:14px;font-size:.9rem;min-height:20px}
.msg.ok{color:#5ee39a}
.msg.err{color:#ff7089}
.count{margin-top:8px;font-size:.8rem;color:var(--dim)}
.hint{color:var(--dim);font-size:.75rem;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1><img src="https://tikki-trikki.ru/img/avatars/av-56.png" alt=""> Рассылка от Тикки</h1>
  <p class="sub">Сообщение уйдёт всем, кто когда-либо запускал бота.</p>

  <div class="card">
    <label for="key">Ключ рассылки</label>
    <input id="key" type="password" placeholder="тот же, что в Netlify → BROADCAST_KEY" autocomplete="off">
    <div class="hint">Сохраняется в этом браузере, вводить каждый раз не нужно.</div>

    <label for="txt">Текст сообщения</label>
    <textarea id="txt" placeholder="Привет! Скучаешь? 🐞&#10;А вот новая серия — «Камило». Заходи и не скучай:&#10;https://tikki-trikki.ru"></textarea>

    <div class="row">
      <button id="go">Отправить всем</button>
      <button id="cnt" class="ghost">Проверить, сколько подписчиков</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="count" id="count"></div>
  </div>
</div>

<script>
(function(){
  var FN = "/api/bot";
  var key = document.getElementById("key"),
      txt = document.getElementById("txt"),
      msg = document.getElementById("msg"),
      cnt = document.getElementById("count"),
      go = document.getElementById("go"),
      btnCnt = document.getElementById("cnt");

  try { key.value = localStorage.getItem("tikki_bk") || ""; } catch(e) {}
  key.addEventListener("change", function(){ try{ localStorage.setItem("tikki_bk", key.value); }catch(e){} });

  function say(text, cls){ msg.className = "msg " + (cls||""); msg.textContent = text; }

  btnCnt.onclick = function(){
    say("Считаю…");
    fetch(FN + "?count=1").then(function(r){ return r.text(); }).then(function(t){
      cnt.textContent = t;
      say("");
    }).catch(function(){ say("Не смог посчитать", "err"); });
  };

  go.onclick = function(){
    var k = key.value.trim(), t = txt.value.trim();
    if(!k){ say("Введите ключ рассылки", "err"); return; }
    if(!t){ say("Напишите текст сообщения", "err"); return; }
    if(!confirm("Отправить это сообщение всем подписчикам?")) return;
    go.disabled = true;
    say("Отправляю…");
    fetch(FN + "?send=1", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({key:k, text:t})
    }).then(function(r){ return r.json(); }).then(function(j){
      go.disabled = false;
      if(j && j.ok){
        say("Готово. Доставлено: " + j.sent + ", не дошло: " + j.failed, "ok");
        cnt.textContent = "Всего подписчиков: " + j.total;
      } else {
        say("Ошибка: " + ((j && j.error) || "неизвестно"), "err");
      }
    }).catch(function(){ go.disabled = false; say("Сеть не отвечает", "err"); });
  };
})();
</script>
</body>
</html>
